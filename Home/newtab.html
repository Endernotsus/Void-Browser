
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Void</title>

    <link id="voidFavicon" rel="icon" type="image/png" href="../defaltIcons/defaltIcon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TOP/BOTTOM BAR -->
    <header class="top-bar">
        <img id="settingsBtn" src="../defaltIcons/defaltGear.png"></img>
        <button id="addBtn" type="button">Add Site</button>
        <div id="clock"></div>

    </header>

    <!-- MIDDLE OF SCREEN -->
    <img id="midImg" src="defaltIcons/defaltMidIcon.gif" alt="Void">
    <!-- =================================
         SHORTCUT GRID
    ================================== -->

    <main id="shortcuts">
        <!-- Shortcuts generated by JavaScript -->
    </main>


    <!-- =================================
         ADD SITE POPUP
    ================================== -->

    <div id="popup">

        <div class="modal">

            <h2>Add a Shortcut</h2>

            <!-- Website name -->

            <input
                type="text"
                id="siteName"
                placeholder="Website name"
                autocomplete="off"
            >


            <!-- Website link -->

            <input
                type="url"
                id="siteLink"
                placeholder="Website URL (https://example.com)"
            >


            <!-- Icon URL -->

            <input
                type="url"
                id="siteIcon"
                placeholder="Icon image URL (optional)"
            >


            <!-- Upload image -->

            <label for="siteImage">
                Upload an icon image:
            </label>

            <input
                type="file"
                id="siteImage"
                accept="image/*"
            >


            <!-- Image preview -->

            <div id="imagePreview"></div>


            <!-- Hidden position values -->

            <input
                type="hidden"
                id="siteX"
            >

            <input
                type="hidden"
                id="siteY"
            >


            <!-- Popup buttons -->

            <div class="popup-buttons">

                <button id="saveBtn" type="button">
                    Save Shortcut
                </button>

                <button id="cancelBtn" type="button">
                    Cancel
                </button>

            </div>

        </div>

    </div>


    <!-- =================================
         DEBUG MENU
    ================================== -->

    <div id="debugMenu">

        <div id="debugHeader">

            <span>Debug Console</span>

            <button
                id="debugToggle"
                type="button"
                title="Collapse debug console"
            >
                −
            </button>

        </div>

        <div id="debugContent">

            <div id="debugLogs"></div>

            <button id="clearLogs" type="button">
                Clear Logs
            </button>

        </div>

    </div>


    <!-- =================================
         JAVASCRIPT
    ================================== -->

    <script src="script.js"></script>

</body>
</html>
